# HTTP → HTTPS redirect for all domains.
# TLS vhosts live only in /etc/nginx/conf.d/domains/*.conf (written by the bot).
# Do not put server_name copies here — they conflict with those files.

limit_req_zone $binary_remote_addr zone=lpapi:10m rate=8r/s;

server {
    listen 80;
    server_name ~^.+$;
    server_tokens off;
    return 301 https://$host$request_uri;
}

include /etc/nginx/conf.d/domains/*.conf;
