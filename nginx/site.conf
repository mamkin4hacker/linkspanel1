# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name ~^.+$;
    return 301 https://$host$request_uri;
}

# id350699039.info
server {
    listen 443 ssl http2;
    server_name id350699039.info *.id350699039.info;

    ssl_certificate     /etc/letsencrypt/live/id350699039.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id350699039.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location ~ /\. {
        deny all;
    }

    location ~* \.(py|pyc|env|md|sql)$ {
        deny all;
    }

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /chat/stream/ {
        proxy_pass         http://api:8000;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   Host             $host;
        proxy_set_header   Connection       '';
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass         http://api:8000;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   Host             $host;
        proxy_read_timeout 10s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

# Per-domain SSL server blocks written by the bot into this directory.
include /etc/nginx/conf.d/domains/*.conf;
