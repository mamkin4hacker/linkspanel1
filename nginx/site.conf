# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name ~^.+$;
    return 301 https://$host$request_uri;
}

# domain1.com — replace with your actual domains
server {
    listen 443 ssl http2;
    server_name domain1.com *.domain1.com;

    ssl_certificate     /etc/letsencrypt/live/domain1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain1.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /chat/stream/ {
        proxy_pass         http://api:8000;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   Host             $host;
        proxy_set_header   Connection       '';
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass         http://api:8000;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   Host             $host;
        proxy_read_timeout 10s;
    }
}

# Add more server blocks below for each domain in your pool.
# Copy the block above and change the domain name and SSL cert path.
