# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name ~^.+$;
    return 301 https://$host$request_uri;
}

# Per-domain HTTPS server blocks are auto-generated by the bot into:
#   /etc/nginx/conf.d/domains/<domain>.conf
# (see bot/utils/nginx_conf.py). Without this include, links are created
# in the DB but browsers hang / show "can't reach this site" because no
# TLS vhost exists for the subdomain.
include /etc/nginx/conf.d/domains/*.conf;
